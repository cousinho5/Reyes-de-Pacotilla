<title>Portada de Aldricia</title>
/*FONTS*/
<style>
:root{--wood-0:#170f0a;--wood-1:#22160e;--wood-2:#33231a;--wood-3:#4b3424;--brass:#d6a64b;--brass-hi:#f1cf7d;--brass-lo:#8c6420;--chalk:#f2e6cc;--dust:#bba78a;--vellum:#f1e5c8;--vellum-2:#e6d5ad;--vellum-line:#cdb68a;--ink:#2a1d14;--ink-soft:#6b5640;--seal:#a8321f;--lapis:#2e5aa8;--moss:#4f7a2e;--f-ui:"Alegreya Sans",system-ui,sans-serif;--f-display:"Alegreya",Georgia,serif;--f-px:"Pixelify Sans","Alegreya Sans",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d0906;color:var(--chalk);font:400 16px/1.4 var(--f-ui)}
body{display:flex;flex-direction:column;align-items:center}
/* controles de la maqueta, fuera del móvil */
.chrome{width:100%;max-width:430px;padding:10px 16px 8px;display:flex;flex-direction:column;gap:8px}
.chrome h1{margin:0;font:800 18px var(--f-display);color:var(--brass-hi)}
.chrome h1 small{font:italic 400 14px var(--f-display);color:var(--dust);margin-left:6px}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:none;font:700 14px var(--f-ui);color:var(--chalk);background:var(--wood-2);border:1px solid #5a4330;border-radius:999px;padding:7px 13px;min-height:36px;cursor:pointer}
.seg button[aria-pressed=true]{background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:var(--ink);border-color:var(--brass-lo)}
.seg.small button{font-size:13px;padding:5px 10px;min-height:32px}
/* el móvil */
.phone{position:relative;width:100%;max-width:430px;flex:1;overflow-y:auto;overflow-x:hidden;border-radius:18px 18px 0 0;outline:1px solid #3a2a1c;
  background:repeating-linear-gradient(92deg,rgba(255,220,170,.025) 0 3px,transparent 3px 11px),repeating-linear-gradient(88deg,rgba(0,0,0,.12) 0 1px,transparent 1px 23px),linear-gradient(180deg,var(--wood-2),var(--wood-1) 40%,var(--wood-0))}
.hero{position:relative;width:100%;aspect-ratio:196/252;overflow:hidden;background:#2c3f74}
.capa{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;will-change:transform}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:22%;background:linear-gradient(180deg,rgba(34,22,14,0),var(--wood-2) 92%);pointer-events:none}
/* título */
.titulo{position:absolute;left:0;right:0;top:4.5%;text-align:center;z-index:3;pointer-events:none;transform-origin:50% 0}
.titulo .rotulo{position:relative;display:inline-block}
.titulo .r1{display:block;font:800 17px/1 var(--f-display);letter-spacing:.32em;text-transform:uppercase;color:#fff1cf;text-shadow:0 2px 0 #3a2410,0 0 10px rgba(0,0,0,.45);margin-left:.32em}
.titulo .r2{display:block;font:800 58px/.95 var(--f-display);letter-spacing:-.01em;color:#ffe08a;background:linear-gradient(180deg,#fff4c4 8%,#f3cd63 45%,#c98d28 78%,#8c5a14);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 0 #3a2410) drop-shadow(0 0 1px #3a2410) drop-shadow(0 6px 10px rgba(0,0,0,.45));padding:0 4px}
.titulo .sub{display:block;margin-top:6px;font:italic 400 15px var(--f-display);color:#fff7e6;text-shadow:0 1px 0 #2a1a0e,0 0 8px rgba(0,0,0,.6)}
.titulo #corona{position:absolute;left:-6px;top:-14px;width:46px;transform:rotate(-16deg);transform-origin:50% 100%}
.titulo #corona .pxi{width:46px;image-rendering:pixelated;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
.titulo #corona .brillo{position:absolute;width:18px;left:28px;top:-4px;image-rendering:pixelated}
.titulo.pequeno .r2{font-size:44px}.titulo.pequeno .r1{font-size:14px}.titulo.pequeno #corona{left:-26px;top:-12px;width:36px}.titulo.pequeno #corona .pxi{width:36px}.titulo.pequeno #corona .brillo{left:22px}
@keyframes cae{0%{transform:translate(18px,-160px) rotate(25deg)}55%{transform:translate(0,4px) rotate(-22deg)}70%{transform:translate(0,-10px) rotate(-10deg)}85%{transform:translate(0,1px) rotate(-18deg)}100%{transform:rotate(-16deg)}}
@keyframes sube{from{opacity:0;transform:translateY(14px)}}
@keyframes aparece{from{opacity:0}}
.titulo .r1{animation:sube .8s .1s both}.titulo .r2{animation:sube .9s .25s both}.titulo .sub{animation:aparece 1s .9s both}
.titulo #corona{animation:cae 1.1s .9s cubic-bezier(.3,.7,.4,1) both}
/* cuerpo */
.cuerpo{position:relative;z-index:2;padding:0 16px 40px;margin-top:-44px}
.cuerpo.entra>*{animation:sube .6s both}
.cuerpo.entra>*:nth-child(2){animation-delay:.08s}.cuerpo.entra>*:nth-child(3){animation-delay:.16s}.cuerpo.entra>*:nth-child(4){animation-delay:.24s}.cuerpo.entra>*:nth-child(5){animation-delay:.32s}
.quieto *,.quieto *:before,.quieto *:after{animation:none!important;transition:none!important}
button{font:700 16px var(--f-ui);min-height:48px;padding:10px 18px;border-radius:8px;border:2px solid var(--ink);background:#fbf3df;color:var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button.primary{background:linear-gradient(180deg,var(--brass-hi),var(--brass) 60%);font-weight:800}
button.grande{font-size:18px;min-height:56px;padding:12px 22px}
button.ancho{width:100%}
button.segundo{background:transparent;color:var(--chalk);border-color:#8a6a46;box-shadow:0 3px 0 #120c08}
.partida button.segundo,.instalar button.segundo{color:var(--ink);border-color:var(--ink);box-shadow:0 3px 0 var(--ink);background:#fbf3df;min-height:44px}
button.link{background:none;border:0;box-shadow:none;color:var(--dust);text-decoration:underline;text-underline-offset:3px;font-weight:500;min-height:44px}
/* Fray Abundio */
.fraycard{display:flex;align-items:flex-end;gap:10px;margin:0 0 14px}
.fraycard .fray{flex:none;image-rendering:pixelated;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.bocadillo{position:relative;margin:0 0 14px;background:linear-gradient(180deg,var(--vellum),var(--vellum-2));color:var(--ink);font:italic 400 16px/1.35 var(--f-display);padding:10px 13px;border-radius:10px;box-shadow:0 0 0 1px rgba(80,50,20,.45),0 6px 14px rgba(0,0,0,.4)}
.bocadillo:before{content:"";position:absolute;left:-8px;bottom:12px;border:8px solid transparent;border-right-color:var(--vellum-2);border-left:0}
.bocadillo.in{animation:aparece .5s both}
/* acciones */
.acciones{display:flex;flex-direction:column;gap:12px;margin:6px 0 22px}
.prologo{align-self:center;display:inline-flex;align-items:center;gap:8px;color:var(--brass-hi);font:700 16px var(--f-ui);text-decoration:none;padding:8px 6px;min-height:44px}
.prologo i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:rgba(214,166,75,.18);border:1px solid var(--brass);font-style:normal;font-size:12px}
.prologo small{color:var(--dust);font-weight:400}
/* cómo se juega */
.pasos{background:linear-gradient(180deg,var(--vellum),var(--vellum-2));color:var(--ink);border-radius:6px;padding:16px 16px 6px;box-shadow:0 0 0 1px rgba(80,50,20,.45),0 6px 14px rgba(0,0,0,.45);margin-bottom:18px}
.pasos h2{margin:0;font:800 22px/1.15 var(--f-display)}
.pasos .lema{margin:4px 0 10px;font:700 13px var(--f-px);letter-spacing:.02em;color:var(--brass-lo)}
.pasos ol{list-style:none;margin:0;padding:0}
.pasos li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px dashed var(--vellum-line)}
.pasos .icono{flex:none;width:64px;height:52px;display:grid;place-items:center;background:radial-gradient(circle,rgba(255,255,255,.55),transparent 70%)}
.pasos .pxi{image-rendering:pixelated}
.pasos b{display:block;font:800 17px var(--f-ui)}.pasos span{display:block;color:var(--ink-soft);font-size:15px;line-height:1.3}
.pie{text-align:center;color:var(--dust);font:italic 14px var(--f-display);padding:8px 10px 0}
/* con partidas */
.hola h2{margin:0 0 8px;font:800 30px/1.1 var(--f-display);color:var(--chalk);text-shadow:0 2px 0 #120c08}
.partida{position:relative;background:linear-gradient(180deg,var(--vellum),var(--vellum-2));color:var(--ink);border-radius:6px;padding:14px;margin:0 0 14px;box-shadow:0 0 0 1px rgba(80,50,20,.45),0 6px 14px rgba(0,0,0,.45)}
.partida.principal{box-shadow:0 0 0 2px var(--brass),0 0 0 4px #3a2410,0 10px 24px rgba(0,0,0,.55)}
.partida.principal:before{content:"Te toca";position:absolute;right:12px;top:-11px;font:800 12px var(--f-px);letter-spacing:.05em;text-transform:uppercase;background:var(--seal);color:#fff;padding:3px 9px;border-radius:4px;box-shadow:0 2px 0 #4a0e08}
.partida header{display:flex;gap:12px;align-items:center}
.partida header .escudo{image-rendering:pixelated;flex:none}
.partida h3{margin:0;font:800 20px/1.1 var(--f-display)}
.partida header p{margin:2px 0 0;color:var(--ink-soft);font-size:15px}
.reloj{display:flex;gap:12px;align-items:center;margin:12px 0 8px;background:#2a1d14;color:var(--chalk);border-radius:6px;padding:10px 12px}
.reloj b{display:block;font:700 15px var(--f-px);color:var(--brass-hi);letter-spacing:.01em}.reloj small{color:var(--dust);font-size:13px}
.arena{flex:none;width:20px;height:30px;position:relative;background:linear-gradient(var(--brass),var(--brass)) top/100% 3px no-repeat,linear-gradient(var(--brass),var(--brass)) bottom/100% 3px no-repeat}
.arena:before{content:"";position:absolute;left:3px;right:3px;top:3px;bottom:3px;clip-path:polygon(0 0,100% 0,55% 50%,100% 100%,0 100%,45% 50%);background:linear-gradient(180deg,#f1cf7d 0 30%,rgba(255,255,255,.12) 30% 70%,#f1cf7d 70%)}
.arena i{position:absolute;left:9px;top:14px;width:2px;height:8px;background:#f1cf7d;animation:caeArena 1s linear infinite}
@keyframes caeArena{50%{opacity:.3}}
.avisos{list-style:none;margin:0;padding:0}
.aviso{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 2px;border-bottom:1px dashed var(--vellum-line);font-size:15px;line-height:1.25}
.aviso .ico{flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:#e2cfa3;color:var(--ink);font:700 14px var(--f-ui)}
.aviso.urgente .ico{background:var(--seal);color:#fff;animation:late 1.6s ease-in-out infinite}
.aviso.urgente{color:var(--seal)}
.aviso .flecha{margin-left:auto;color:var(--ink-soft);font-size:20px}
@keyframes late{50%{box-shadow:0 0 0 5px rgba(168,50,31,.18)}}
.clasif{margin:10px 0 4px}
.clasif .fila{display:flex;align-items:flex-end;justify-content:space-between;gap:2px;padding:8px 6px 4px;background:rgba(255,255,255,.35);border-radius:6px}
.clasif .fila span{display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11px var(--f-px);color:var(--ink-soft)}
.clasif .fila span.yo{color:var(--ink);transform:translateY(-3px)}
.clasif .fila span.yo:after{content:"";width:22px;height:3px;background:var(--brass);border-radius:2px}
.clasif .escudo{image-rendering:pixelated}
.clasif p{margin:6px 0 0;font-size:15px}.sube{color:var(--moss);font-weight:800}
.tureino{display:flex;gap:12px;align-items:center;margin:10px 0 14px}
.minimapa{flex:none;width:150px;height:90px;border-radius:4px;image-rendering:pixelated;box-shadow:0 0 0 2px #3a2410,0 0 0 3px var(--brass)}
.tureino b{display:block;font:800 16px var(--f-ui)}.tureino span{color:var(--ink-soft);font-size:14px}
.sep{margin:22px 0 10px;font:800 13px var(--f-px);letter-spacing:.06em;text-transform:uppercase;color:var(--dust)}
.corte{display:flex;gap:6px;align-items:center;margin:10px 0 4px}.corte .escudo{image-rendering:pixelated}
.hueco{display:inline-block;width:20px;height:24px;border:2px dashed var(--vellum-line);border-radius:4px 4px 10px 10px}
.hueco.grande{width:30px;height:36px}
.nota{margin:6px 0 10px;font-size:15px;color:var(--ink-soft)}.nota b{color:var(--ink)}
.partida.ganada{background:linear-gradient(180deg,#f7ebc8,#e9d29a)}
.medalla{margin-left:auto}.medalla .pxi{image-rendering:pixelated;animation:flota 3s ease-in-out infinite}
@keyframes flota{50%{transform:translateY(-3px)}}
.vitrina{margin:18px 0;padding:12px 14px;border-radius:6px;background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 1px #4a3524}
.vitrina h4{margin:0 0 8px;font:800 13px var(--f-px);letter-spacing:.06em;text-transform:uppercase;color:var(--dust)}
.balda{display:flex;gap:14px;align-items:flex-end;padding:0 6px 6px;border-bottom:6px solid #6e4f22;box-shadow:0 4px 0 #2a1a0e}
.balda .pxi{image-rendering:pixelated}
.balda .vacio{width:34px;height:22px;border:2px dashed #6e5a40;border-radius:4px;opacity:.6}
.vitrina p{margin:8px 0 0;color:var(--dust);font-size:14px}
.instalar{display:flex;gap:10px;align-items:center;background:linear-gradient(180deg,var(--vellum),var(--vellum-2));color:var(--ink);border-radius:6px;padding:10px 12px;margin:0 0 14px}
.instalar .fray{image-rendering:pixelated;flex:none}.instalar p{margin:0;font-size:14px;line-height:1.3}
.invita label{display:block;font-weight:700;color:var(--dust);font-size:15px}
.invita span{display:flex;gap:8px;margin-top:6px}
.invita input{flex:1;min-height:48px;border-radius:8px;border:2px solid var(--vellum-line);background:#fffaf0;padding:0 12px;font:16px var(--f-ui)}
.salir{display:block;margin:12px auto 0}
/* invitación */
.bando{position:relative;margin:-30px 0 18px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
.bando .rollo{height:16px;border-radius:8px;background:linear-gradient(180deg,#c9a46a,#f4e2b8 45%,#9c7a44);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);margin:0 -6px;position:relative;z-index:2}
.bando .papel{position:relative;margin:-6px 4px;padding:22px 18px 22px;text-align:center;background:linear-gradient(180deg,#f6ecd2,#ead7a8);color:var(--ink);transform-origin:50% 0;animation:desenrolla 1s .2s cubic-bezier(.2,.8,.3,1) both}
@keyframes desenrolla{from{transform:scaleY(.05);opacity:.4}}
.bando small{display:block;font:800 12px var(--f-px);letter-spacing:.12em;text-transform:uppercase;color:var(--seal)}
.bando p{margin:8px 0 0;font:400 17px var(--f-display)}
.bando h2{margin:4px 0 6px;font:800 34px/1.05 var(--f-display);color:#3a2410}
.bando .datos{font:400 15px/1.35 var(--f-ui);color:var(--ink-soft)}
.bando .sello{position:absolute;right:12px;bottom:-14px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 35%,#d8503c,#8a1f16 70%);color:#f9d0c0;font:800 20px var(--f-display);box-shadow:0 2px 0 #4a0e08;animation:sella .5s 1.1s both}
@keyframes sella{from{opacity:0;transform:scale(2.2)}}
.bando .rollo.abajo{margin-top:0}
.cortesanos{background:rgba(0,0,0,.25);border-radius:6px;padding:12px 14px;box-shadow:inset 0 0 0 1px #4a3524;margin-bottom:18px}
.cortesanos h4{margin:0 0 6px;font:800 13px var(--f-px);letter-spacing:.06em;text-transform:uppercase;color:var(--dust)}
.cortesanos ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.cortesanos li{display:flex;gap:8px;align-items:center;min-width:0}
.cortesanos .escudo{image-rendering:pixelated;flex:none}
.cortesanos b{display:block;font:700 14px/1.15 var(--f-ui);color:var(--chalk)}.cortesanos i{display:block;font:italic 13px/1.2 var(--f-display);color:var(--dust)}
.cortesanos li.libre b{color:var(--brass-hi)}.cortesanos .hueco{border-color:#8a6a46}
.quees{margin:6px 0 18px}.quees summary{cursor:pointer;color:var(--brass-hi);font-weight:700;min-height:44px;display:flex;align-items:center}
.quees .pasos{margin-top:8px}
/* hoja inferior para entrar */
.hoja{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.hoja .fondo{position:absolute;inset:0;background:rgba(10,6,3,.55);opacity:0;transition:opacity .25s}
.hoja .panel{position:relative;width:100%;max-width:430px;background:linear-gradient(180deg,var(--vellum),var(--vellum-2));color:var(--ink);border-radius:16px 16px 0 0;padding:10px 18px 26px;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.3,1);box-shadow:0 -10px 30px rgba(0,0,0,.5)}
.hoja.abierta .fondo{opacity:1}.hoja.abierta .panel{transform:none}
.hoja .asa{width:44px;height:5px;border-radius:3px;background:var(--vellum-line);margin:0 auto 12px}
.hoja h2{margin:0;font:800 24px var(--f-display)}
.hoja p{margin:6px 0 14px;color:var(--ink-soft);font-size:15px}
.casillas{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:16px;cursor:text}
.casillas i{height:58px;display:grid;place-items:center;background:#fffaf0;border:2px solid var(--vellum-line);border-radius:8px;font:700 28px var(--f-px);font-style:normal;color:var(--ink);box-shadow:inset 0 2px 0 rgba(60,40,10,.08)}
.casillas i.activa{border-color:var(--brass-lo);box-shadow:0 0 0 3px rgba(214,166,75,.35)}
.hoja input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.hoja .fray-hoja{display:flex;gap:10px;align-items:center;margin-top:14px;font:italic 14px/1.3 var(--f-display);color:var(--ink-soft)}
.hoja .fray-hoja .fray{image-rendering:pixelated;flex:none}
.nota-maqueta{margin:18px 0 0;padding-top:12px;border-top:1px solid #3a2a1c;color:var(--dust);font-size:13px;text-align:center}
/* de noche, el título brilla un poco más */
body[data-hora=noche] .titulo .r2{filter:drop-shadow(0 3px 0 #120a20) drop-shadow(0 0 1px #120a20) drop-shadow(0 0 14px rgba(255,210,120,.35))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<header class="chrome">
  <h1>Portada · maqueta <small>bloque 7</small></h1>
  <nav class="seg" id="tabs" aria-label="Pantalla"><button type="button" data-p="fuera" aria-pressed="true">Sin entrar</button><button type="button" data-p="dentro">Con partidas</button><button type="button" data-p="invitacion">Invitación</button></nav>

</header>

    <div class="titulo" id="titulo"><div class="rotulo"><span id="corona" aria-hidden="true"></span><span class="r1">Reyes de</span><span class="r2">Pacotilla</span></div><span class="sub">Aldricia, el Reino Más o Menos Unido</span></div>

</div>
<script>const DATA = /*DATA*/;</script>
<script>/*JS*/</script>
