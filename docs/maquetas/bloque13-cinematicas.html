<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Cinemáticas de Aldricia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,800;1,400;1,800&family=Alegreya+Sans:wght@400;800&family=Pixelify+Sans:wght@600&display=swap">
<style>
/* Mesa de nogal de noche: el escenario en pixel art arriba y el pergamino de Fray Abundio debajo. */
:root{
 --wood-0:#120c08;--wood-2:#33231a;--brass:#d6a64b;--brass-hi:#f1cf7d;--chalk:#f2e6cc;--dust:#bba78a;
 --vellum:#f1e5c8;--vellum-2:#e2cc96;--ink:#2a1d14;--ink-soft:#6b5640;--seal:#a8321f;--moss:#4f7a2e;
 --f-display:"Alegreya",Georgia,serif;--f-ui:"Alegreya Sans",system-ui,sans-serif;--f-num:"Pixelify Sans",ui-monospace,monospace;
 color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:repeating-linear-gradient(92deg,rgba(255,220,170,.025) 0 3px,transparent 3px 11px),linear-gradient(180deg,var(--wood-2),var(--wood-0));background-attachment:fixed;color:var(--chalk);font-family:var(--f-ui);display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;box-sizing:border-box}
.player{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top h1{margin:0;font:800 19px var(--f-display);color:var(--brass-hi)}
button{font:800 14px var(--f-ui);color:var(--chalk);background:rgba(0,0,0,.35);border:1px solid rgba(214,166,75,.5);border-radius:4px;min-height:40px;padding:0 12px;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}
#tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#tabs button{flex:none;min-height:36px;font-size:13px;border-radius:18px;padding:0 12px}
#tabs button.on{background:var(--brass);color:var(--ink);border-color:var(--brass)}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:160/176;overflow:hidden;border-radius:4px;box-shadow:0 0 0 2px #000,0 0 0 4px var(--brass),0 10px 24px rgba(0,0,0,.6);background:#0b0810;cursor:pointer;container-type:inline-size}
#px{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#maplayer{position:absolute;inset:0;background:#141c12}
#mw{position:absolute;left:0;top:0;transform-origin:0 0}
#mw canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#over{position:absolute;inset:0;pointer-events:none}
#over button{pointer-events:auto}
.bar{height:3px;background:rgba(242,230,204,.15);border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--brass)}
.cap{background:radial-gradient(ellipse at 30% 10%,rgba(255,255,240,.55),transparent 60%),linear-gradient(180deg,var(--vellum),var(--vellum-2));color:var(--ink);border-radius:3px;padding:12px 14px 12px 88px;min-height:96px;position:relative;box-shadow:0 0 0 1px rgba(80,50,20,.5),inset 0 0 20px rgba(120,80,30,.3)}
#fray{position:absolute;left:8px;top:10px;width:72px;height:72px;image-rendering:pixelated}
.cap p{margin:0;font:400 17px/1.3 var(--f-display);text-wrap:balance}
.cap small{display:block;margin-top:6px;font:italic 400 14px/1.3 var(--f-display);color:var(--ink-soft)}
.nav{display:flex;align-items:center;gap:8px}
.dots{flex:1;display:flex;gap:6px;justify-content:center;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(242,230,204,.25)}.dots i.on{background:var(--brass-hi)}
#count{font:600 13px var(--f-num);color:var(--dust);min-width:52px;text-align:center}
.note{margin:0;font-size:13px;color:var(--dust);line-height:1.4}
canvas[data-shield],canvas[data-sprite]{image-rendering:pixelated}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* título */
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;background:radial-gradient(ellipse at center,rgba(0,0,0,.05),rgba(0,0,0,.7))}
.title .big{font:800 clamp(34px,12cqw,50px)/.95 var(--f-display);color:var(--brass-hi);text-shadow:0 3px 0 #3b2208,0 0 24px rgba(0,0,0,.9)}
.title .sub{font:italic 400 16px var(--f-display);color:var(--chalk);text-shadow:0 1px 4px #000}
.play .title .big{animation:rise 1.8s .6s ease-out both}.play .title .sub{animation:rise 1.6s 1.8s ease-out both}
.clouds i{position:absolute;width:70%;height:40%;border-radius:50%;background:radial-gradient(closest-side,rgba(245,240,230,.55),rgba(245,240,230,0));filter:blur(2px)}
.clouds i:nth-child(1){left:-20%;top:5%}.clouds i:nth-child(2){left:45%;top:25%}.clouds i:nth-child(3){left:-10%;top:55%}.clouds i:nth-child(4){left:50%;top:70%}
.play .clouds i{animation:drift 6s linear both}.play .clouds i:nth-child(even){animation-name:drift2}
@keyframes drift{to{transform:translateX(25%)}}@keyframes drift2{to{transform:translateX(-25%)}}
.play .clouds.out i{animation:cloudout 2.8s ease-in both}.play .clouds.out i:nth-child(even){animation-name:cloudout2}
@keyframes cloudout{to{transform:translateX(-120%);opacity:0}}@keyframes cloudout2{to{transform:translateX(120%);opacity:0}}
/* efectos de cómic */
.sfx{position:absolute;font:800 clamp(26px,9cqw,40px) var(--f-display);color:#fff4c8;-webkit-text-stroke:2px #1a1410;paint-order:stroke;text-shadow:0 3px 0 #1a1410;opacity:0}
.sfx1{left:8%;top:12%;transform:rotate(-8deg)}.sfx2{right:10%;top:52%;transform:rotate(6deg)}
.play .sfx1{animation:pop 1.6s 1.15s both}.play .sfx2{animation:pop 1.6s 3.85s both}
@keyframes pop{0%{opacity:0;scale:.3}15%{opacity:1;scale:1.25}25%{scale:1}80%{opacity:1}100%{opacity:0}}
.flash{position:absolute;inset:0;background:#fff;opacity:0}.play .flash{animation:flash .9s 2s ease-out both}
@keyframes flash{0%{opacity:0}10%{opacity:.85}100%{opacity:0}}
/* testamento */
.scroll{position:absolute;left:8%;right:8%;top:5%;transform-origin:50% 0;background:radial-gradient(ellipse at 30% 20%,rgba(255,255,240,.6),transparent 60%),linear-gradient(180deg,#f4e6c0,#e2cc96);color:var(--ink);padding:14px 16px 16px;border-radius:2px;box-shadow:0 8px 20px rgba(0,0,0,.6),inset 0 0 18px rgba(120,80,30,.35);text-align:center}
.scroll:before,.scroll:after{content:"";position:absolute;left:-7px;right:-7px;height:11px;border-radius:6px;background:linear-gradient(180deg,#d8b478,#8a6a3a);box-shadow:0 1px 0 #3a2414}
.scroll:before{top:-7px}.scroll:after{bottom:-7px}
.scroll h3{margin:0 0 6px;font:800 12px var(--f-ui);letter-spacing:2px;text-transform:uppercase;color:var(--seal)}
.scroll .will{font:800 clamp(19px,6.4cqw,25px)/1.12 var(--f-display);text-wrap:balance}
.scroll .sig{font:italic 400 14px var(--f-display);margin-top:6px}
.scroll .pd{font:italic 400 14px/1.25 var(--f-display);margin-top:8px;color:var(--ink-soft)}
.seal{position:absolute;right:-4px;bottom:-16px;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d8503c,#8a1f16 70%);box-shadow:0 2px 0 #4a0e08;opacity:0}
.play .scroll{animation:unroll 1.3s .2s ease-out both}.play .pd{animation:rise .8s 2.4s both}.play .seal{animation:stampin .5s 1.6s both}
@keyframes unroll{from{transform:scaleY(.04);opacity:.3}to{transform:none;opacity:1}}
@keyframes stampin{from{opacity:0;scale:2.2}to{opacity:1;scale:1}}
/* pretendientes */
.suitors{position:absolute;inset:4% 2% 3%;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-end;gap:6px 0}
.pre{width:25%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;opacity:0;box-sizing:border-box;padding:0 2px}

.flag{position:relative;width:min(70px,18cqw);aspect-ratio:7/9;background:linear-gradient(90deg,rgba(0,0,0,.25),transparent 30%,rgba(255,255,255,.12) 50%,transparent 70%,rgba(0,0,0,.3)),var(--c);clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);display:flex;justify-content:center;padding-top:14%;box-sizing:border-box}
.flag:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--brass)}
.flag canvas{width:62%;height:auto;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
.pre b{max-width:100%;text-shadow:0 1px 0 #000,0 0 6px #000;font:800 11.5px/1.05 var(--f-ui);color:var(--chalk);border-bottom:3px solid var(--c);padding-bottom:1px;margin-top:2px}
.pre em{max-width:100%;text-shadow:0 1px 0 #000,0 0 6px #000;font:italic 400 11px/1.1 var(--f-display);color:var(--dust)}
.play .pre{animation:drop .6s calc(.3s + var(--i)*.55s) cubic-bezier(.3,1.5,.6,1) both}

@keyframes drop{from{opacity:0;transform:translateY(-80px)}to{opacity:1}}
@keyframes drop5{from{opacity:0;transform:translate(50%,-80px)}to{opacity:1;transform:translateX(50%)}}
.suitors{grid-template-rows:auto auto}
.pre:nth-child(n+5){margin-left:0}
/* mapa */
.yours{position:absolute;transform:translate(-50%,-260%);background:var(--brass);color:var(--ink);font:800 14px var(--f-ui);padding:4px 10px;border-radius:3px;white-space:nowrap;opacity:0;box-shadow:0 2px 0 #5a3d12}
.yours:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--brass);border-bottom:0}
.play .yours{animation:fade .5s 6.9s both}
.cta{position:absolute;left:50%;bottom:5%;translate:-50% 0;background:linear-gradient(180deg,#e9c06a,#b88a33)!important;color:var(--ink)!important;border:0!important;box-shadow:0 0 0 1px #6b4a10,inset 0 1px 0 #ffe7a8,0 3px 0 #5a3d12;min-height:48px;padding:0 22px;opacity:0}
.play .cta{animation:fade .5s 7.6s both}
.weekbox{position:absolute;left:0;right:0;top:4%;display:flex;flex-direction:column;align-items:center;gap:6px}
.wk{font:600 clamp(22px,7cqw,30px) var(--f-num);color:var(--brass-hi);text-shadow:0 2px 0 #000}
.wbar{width:60%;height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}.wbar i{display:block;height:100%;width:0;background:var(--brass)}
/* hojas de pergamino */
.sheet{position:absolute;inset:3%;background:radial-gradient(ellipse at 30% 10%,rgba(255,255,240,.5),transparent 60%),linear-gradient(180deg,#f4e6c0,#e2cc96);color:var(--ink);border-radius:3px;padding:10px 10px;box-shadow:inset 0 0 22px rgba(120,80,30,.35);display:flex;flex-direction:column;gap:3px;overflow:hidden}
.sheet h4{margin:0 0 2px;text-align:center;font:800 12px var(--f-ui);letter-spacing:2px;text-transform:uppercase;color:var(--seal)}
.obj,.tit{display:flex;align-items:center;gap:7px;padding:3px 2px;border-bottom:1px solid rgba(120,80,30,.25);opacity:0;position:relative}
.obj canvas,.tit canvas{width:22px;flex:none}
.obj div,.tit div{flex:1;min-width:0;display:flex;flex-direction:column}
.obj b,.tit b{font:800 12px/1.1 var(--f-ui);color:var(--ink);border-left:3px solid var(--c);padding-left:4px}
.obj span{font:400 12.5px/1.15 var(--f-display);color:var(--ink-soft)}
.stamp{flex:none;font:800 10.5px/1.05 var(--f-ui);font-style:normal;text-transform:uppercase;text-align:center;padding:3px 5px;border:2px solid currentColor;border-radius:3px;rotate:-8deg;width:58px;box-sizing:border-box}
.stamp.ok{color:var(--moss)}.stamp.ko{color:var(--seal)}
.play .obj,.play .tit{animation:rise .5s calc(.3s + var(--i)*1.05s) both}
.play .stamp{animation:stampin .35s calc(.75s + var(--i)*1.05s) both}
.tit strong{font:italic 800 clamp(15px,4.6cqw,18px)/1.1 var(--f-display);color:var(--ink)}
.tit small{font:400 12px/1.1 var(--f-ui);color:var(--ink-soft)}
.titles .tit{padding:4px 2px}
/* podio */
.podnames{position:absolute;inset:0}
.pn{position:absolute;width:30%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:0;opacity:0}
.pn b{font:800 12px/1.05 var(--f-ui);color:var(--chalk);border-bottom:3px solid var(--c)}
.num{font:600 clamp(22px,7cqw,30px) var(--f-num);color:var(--brass-hi);text-shadow:0 2px 0 #000}
.pn.p0{left:7.5%;top:76%}.pn.p1{left:35%;top:66%}.pn.p2{left:62.5%;top:81%}
.play .pn{animation:fade .5s 1s both}
/* coronación */
.hail{position:absolute;left:0;right:0;bottom:22%;text-align:center;font:800 clamp(22px,7.4cqw,30px)/1.05 var(--f-display);color:#fff4c8;-webkit-text-stroke:2px #3b2208;paint-order:stroke;text-shadow:0 3px 0 #3b2208;opacity:0}
.play .hail{animation:pop2 1s 5.3s both}@keyframes pop2{0%{opacity:0;scale:.4}60%{opacity:1;scale:1.12}100%{opacity:1;scale:1}}
.endbtns{position:absolute;left:5%;right:5%;bottom:4%;display:flex;gap:6px;opacity:0}
.endbtns button{flex:1;min-height:44px;font-size:13px;background:linear-gradient(180deg,#e9c06a,#b88a33);color:var(--ink);border:0;box-shadow:0 0 0 1px #6b4a10,0 3px 0 #5a3d12;line-height:1.1}
.endbtns button.sec{background:rgba(20,12,8,.75);color:var(--chalk);box-shadow:0 0 0 1px var(--brass)}
.play .endbtns{animation:fade .6s 6.3s both}
.dong{position:absolute;font:800 clamp(24px,8cqw,34px) var(--f-display);color:#fff4c8;-webkit-text-stroke:2px #3a1c22;paint-order:stroke;opacity:0}
.d1{left:6%;top:20%;rotate:-10deg}.d2{right:6%;top:30%;rotate:8deg}
.play .d1{animation:pop 1.2s .3s infinite}.play .d2{animation:pop 1.2s .9s infinite}
/* eventos */
.evcard{position:absolute;left:5%;right:5%;top:4%;background:rgba(20,12,8,.82);border:1px solid var(--brass);border-radius:4px;padding:8px 12px;display:flex;flex-direction:column;gap:1px;opacity:0}
.evcard small,.bando small,.last small{font:800 11px var(--f-ui);letter-spacing:1.5px;text-transform:uppercase;color:var(--brass)}
.evcard b{font:800 clamp(18px,6cqw,22px)/1.1 var(--f-display);color:var(--chalk)}
.evcard span{font:800 14px var(--f-ui);color:#ffcf9a}
.play .evcard{animation:rise .6s .5s both}
.bando{position:absolute;left:12%;right:12%;top:4%;background:linear-gradient(180deg,#f4e6c0,#e2cc96);color:var(--ink);padding:10px 12px;border-radius:2px;text-align:center;box-shadow:0 6px 14px rgba(0,0,0,.45),inset 0 0 14px rgba(120,80,30,.3);transform-origin:50% 0;opacity:0;display:flex;flex-direction:column;gap:2px}
.bando small{color:var(--seal)}.bando b{font:800 clamp(18px,6cqw,22px)/1.1 var(--f-display)}.bando span{font:400 15px/1.2 var(--f-display)}
.play .bando{animation:unroll 1s .6s ease-out both}
.last{position:absolute;right:4%;top:6%;width:50%;display:flex;flex-direction:column;gap:4px;opacity:0}
.last b{font:800 clamp(20px,6.6cqw,26px)/1.05 var(--f-display);color:var(--brass-hi)}
.nights{font:600 clamp(16px,5cqw,20px) var(--f-num);color:var(--chalk)}
.last ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.last li{display:flex;align-items:center;gap:6px;font:800 12.5px var(--f-ui);color:var(--chalk)}
.last li i{width:8px;height:8px;border-radius:2px;flex:none}.last li em{margin-left:auto;font:600 15px var(--f-num);font-style:normal;color:var(--brass-hi)}
.play .last{animation:rise .7s .4s both}
.bubble{position:absolute;left:30%;right:4%;top:6%;background:#f4fcff;color:#1e3a50;border-radius:12px;padding:10px 12px;font:italic 400 clamp(14px,4.4cqw,17px)/1.25 var(--f-display);box-shadow:0 4px 0 #3d6e8e;opacity:0}
.bubble:after{content:"";position:absolute;left:24%;bottom:-12px;border:10px solid transparent;border-top-color:#f4fcff;border-bottom:0}
.play .bubble{animation:pop2 .8s 2.7s both}
@media (prefers-reduced-motion: reduce){.play *{animation-duration:.001s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>

    sc = Math.min(W / M.w, H / M.h) * 1.0; tx = (W - M.w * sc) / 2; ty = (H - M.h * sc) / 2 + 14;
    const w = Math.min(6, Math.floor(t / 1.25)), prev = M.weeks[Math.max(0, w - 1)], cur2 = M.weeks[w];
    M.cells.forEach((c, i) => { const own = cur2[i]; if (!own) return; const col = DATA.houses[own - 1].color; const fresh = w > 0 && prev[i] !== own;
      vg.beginPath(); c.poly.forEach(([x, y], k) => (k ? vg.lineTo(x, y) : vg.moveTo(x, y))); vg.closePath();
      vg.globalAlpha = 0.5; vg.fillStyle = col; vg.fill(); vg.globalAlpha = 1; vg.lineWidth = 3; vg.strokeStyle = col; vg.stroke();
      if (fresh) { const p = (t / 1.25) % 1; vg.globalAlpha = Math.max(0, 0.7 - p); vg.fillStyle = "#fff8d0"; vg.fill(); vg.globalAlpha = 1; } });
    const wk = over.querySelector(".wk"); if (wk) wk.textContent = w === 0 ? "Al empezar" : "Semana " + w; const bar = over.querySelector(".wbar i"); if (bar) bar.style.width = (w / 6) * 100 + "%";
  }
  mw.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`;
  document.getElementById("mapC").style.opacity = o.mode === "weeks" ? 0 : colA;
  document.getElementById("mapN").style.filter = sep ? `sepia(${0.75 * sep}) brightness(${1 - 0.4 * sep})` : "none";
}

// --------------------------------------------------------- Secuencias
let seqKey = "prologo", idx = 0, cur = "titulo", t0 = performance.now(), still = null;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const frayC = {}; for (const m of Object.keys(DATA.fray)) frayC[m] = fromGrid(DATA.fray[m].grid, DATA.fray[m].palette).canvas();
function fillCanvases(root) {
  root.querySelectorAll("canvas[data-shield]").forEach((c) => { const s = R.shieldC[+c.dataset.shield]; c.width = s.width; c.height = s.height; c.getContext("2d").drawImage(s, 0, 0); });
  root.querySelectorAll("canvas[data-sprite]").forEach((c) => { const s = R[c.dataset.sprite]; c.width = s.width; c.height = s.height; c.getContext("2d").drawImage(s, 0, 0); });
}
function renderTabs() {
  const tabs = document.getElementById("tabs"); tabs.innerHTML = "";
  for (const [k, v] of Object.entries(SEQ)) { const b = document.createElement("button"); b.type = "button"; b.textContent = v.name; b.className = k === seqKey ? "on" : ""; b.setAttribute("aria-pressed", k === seqKey); b.onclick = () => go(k, 0); tabs.appendChild(b); }
}
function go(k, i, stillT = null) {
  seqKey = k; idx = i; cur = SEQ[k].scenes[i]; const s = S[cur];
  still = stillT != null ? stillT : reduced ? s.dur : null; t0 = performance.now();
  over.innerHTML = typeof s.html === "function" ? s.html() : s.html || ""; fillCanvases(over);
  over.classList.remove("play"); void over.offsetWidth; over.classList.add("play");
  cv.hidden = !!s.map; mapLayer.hidden = !s.map; cv.style.transform = "";
  document.getElementById("txt").textContent = s.text; const f = document.getElementById("foot"); f.textContent = s.foot || ""; f.hidden = !s.foot;
  const fc = document.getElementById("fray"); const src = frayC[s.fray]; fc.width = src.width; fc.height = src.height; const fx = fc.getContext("2d"); fx.clearRect(0, 0, fc.width, fc.height); fx.drawImage(src, 0, 0);
  const dots = document.getElementById("dots"); dots.innerHTML = ""; SEQ[k].scenes.forEach((_, j) => { const d = document.createElement("i"); if (j === i) d.className = "on"; dots.appendChild(d); });
  document.getElementById("count").textContent = `${i + 1} de ${SEQ[k].scenes.length}`;
  renderTabs();
  if (still != null) requestAnimationFrame(() => over.getAnimations({ subtree: true }).forEach((a) => { a.pause(); a.currentTime = still * 1000; }));
  const cta = over.querySelector(".cta"); if (cta) cta.onclick = (e) => { e.stopPropagation(); go("prologo", 0); };
}
function frame(now) {
  const s = S[cur]; const t = still != null ? still : (now - t0) / 1000;
  s.draw(Math.min(t, s.dur));
  over.querySelectorAll(".num").forEach((n, k) => { n.textContent = Math.round(+n.dataset.to * ease(clamp((t - 1.2 - k * 0.15) / 1.6))); });
  document.getElementById("prog").style.width = clamp(t / s.dur) * 100 + "%";
  if (still == null && t > s.dur + 0.4 && idx < SEQ[seqKey].scenes.length - 1) go(seqKey, idx + 1);
  requestAnimationFrame(frame);
}
stageEl.addEventListener("click", (e) => { if (e.target.closest("button")) return; if (idx < SEQ[seqKey].scenes.length - 1) go(seqKey, idx + 1); else go(seqKey, idx, S[cur].dur); });
document.getElementById("next").onclick = () => go(seqKey, Math.min(idx + 1, SEQ[seqKey].scenes.length - 1));
document.getElementById("prev").onclick = () => go(seqKey, Math.max(idx - 1, 0));
document.getElementById("skip").onclick = () => { const n = SEQ[seqKey].scenes.length - 1; go(seqKey, n, S[SEQ[seqKey].scenes[n]].dur); };
prep();
const m = /^#([a-z]+)(?:-(\d))?(?:-t(\d+)|-(fin))?$/.exec(location.hash);
if (m && SEQ[m[1]]) go(m[1], +(m[2] || 0), m[3] ? +m[3] / 10 : m[4] ? 999 : null); else go("prologo", 0);
requestAnimationFrame(frame);

</script>
